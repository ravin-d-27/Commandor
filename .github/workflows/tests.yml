name: tests

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main, feature/**]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
          # Install the runtime deps so the new modules that depend on
          # them (multimodal, web_ops, tokenizer) can import.
          python -m pip install \
              httpx \
              beautifulsoup4 \
              tiktoken \
              pyyaml \
              rich
          # LangChain is only needed for the integration tests in
          # agent/, which are out of scope for the test suite in tests/.

      - name: Run tests
        run: |
          python -m pytest -v --tb=short
